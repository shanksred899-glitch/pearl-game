<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pearl Diver</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--sea:#06222b;--deep:#0a3340;--foam:#e9f5f2;--pearl:#fff6e0;--coral:#ff7a59;--gold:#ffd166;--mute:#8fb3b8;--line:#15505f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--sea);color:var(--foam);font-family:'Tajawal',system-ui,-apple-system,'Noto Sans','Hiragino Sans','PingFang SC',sans-serif;min-height:100vh}
main{max-width:480px;margin:0 auto;padding:12px 16px 24px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar h1{font-size:18px;margin:0}
select{font:inherit;background:var(--deep);color:var(--foam);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.slot{min-height:60px;margin:10px 0;border:1px dashed var(--line);border-radius:10px;display:grid;place-items:center;color:var(--mute);font-size:13px}
.top{text-align:center}
.count{font-size:52px;font-weight:800;color:var(--pearl);line-height:1.1}
.rate{color:var(--mute);font-size:15px}
.boost{display:none;margin:8px auto 0;width:max-content;background:var(--coral);color:#2a0d05;border-radius:99px;padding:4px 14px;font-weight:800;font-size:14px}
.stage{position:relative;height:240px;display:grid;place-items:center;margin:6px 0}
#oyster{width:180px;height:180px;border-radius:50%;border:0;cursor:pointer;background:radial-gradient(circle at 35% 30%,#fff 0,var(--pearl) 28%,#d9c9a3 62%,#9a8a63 100%);box-shadow:0 0 0 14px var(--deep),0 0 0 15px var(--line),0 20px 50px rgba(0,0,0,.5);transition:transform .08s}
#oyster:active{transform:scale(.93)}
.gold{position:absolute;width:54px;height:54px;border-radius:50%;border:0;cursor:pointer;background:radial-gradient(circle at 35% 30%,#fff7d1,var(--gold) 55%,#b8860b);box-shadow:0 0 22px var(--gold);animation:pulse 1s infinite alternate}
@keyframes pulse{to{transform:scale(1.18)}}
.float{position:absolute;pointer-events:none;font-weight:800;color:var(--pearl);animation:up .8s ease-out forwards}
@keyframes up{to{transform:translateY(-90px);opacity:0}}
h2{font-size:17px;margin:20px 0 8px}
.row{display:flex;align-items:center;gap:12px;background:var(--deep);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.row .info{flex:1}.row b{display:block;font-size:16px}.row small{color:var(--mute)}
button.buy,button.act{font-family:inherit;font-weight:800;border:0;border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer}
button.buy{background:var(--pearl);color:#3a2f12;min-width:84px}
button.buy:disabled{opacity:.35}
button.act{width:100%;background:var(--coral);color:#2a0d05;margin-bottom:8px;padding:14px}
button.alt{background:transparent;color:var(--foam);border:1px solid var(--mute)}
#modal{position:fixed;inset:0;background:rgba(3,15,19,.86);display:none;place-items:center;z-index:9;padding:24px}
#modal div{background:var(--deep);border:1px solid var(--line);border-radius:18px;padding:24px;max-width:340px;text-align:center}
.note{color:var(--mute);font-size:13px;text-align:center;margin-top:16px}
</style>
</head>
<body>
<main>
  <div class="bar"><h1 data-i="t"></h1>
    <select id="lang" aria-label="Language">
      <option value="en">English</option><option value="ar">العربية</option><option value="it">Italiano</option>
      <option value="zh">中文</option><option value="ja">日本語</option><option value="hi">हिन्दी</option>
    </select></div>
  <div class="slot"><span class="adl"></span></div>
  <div class="top">
    <div class="count" id="count">0</div>
    <div class="rate" id="rate"></div>
    <div class="boost" id="boost"></div>
  </div>
  <div class="stage" id="stage"><button id="oyster" aria-label="Pearl"></button></div>
  <div class="slot"><span class="adl"></span></div>

  <h2 data-i="up"></h2>
  <div id="ups"></div>

  <h2 data-i="bo"></h2>
  <button class="act" id="adBtn" data-i="ad"></button>
  <button class="act alt" id="payBtn" data-i="pay"></button>
  <button class="act alt" id="dayBtn" data-i="day"></button>
  <button class="act alt" id="invBtn" data-i="inv"></button>
  <div class="slot"><span class="adl"></span></div>
  <p class="note" data-i="save"></p>
</main>
<div id="modal"><div><p id="mtext"></p><button class="act" id="mclose" data-i="ok"></button></div></div>

<script>
const TEST_MODE = true;
function showRewardedAd(onDone){ openModal(T('ld')); setTimeout(()=>{closeModal();onDone();},TEST_MODE?2500:0); }
function startPurchase(onDone){ if(TEST_MODE){onDone();return;} openModal('Payment not enabled.'); }
const I={
en:{t:'Pearl Diver',pl:'pearls · {n} per second',lv:'Lv',up:'Upgrades',bo:'Boosts',ad:'Watch an ad: ×2 for 2 minutes',pay:
